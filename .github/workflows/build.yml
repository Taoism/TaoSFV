name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build TaoSFV.sln -c Release

      - name: Test
        run: dotnet test TaoSFV.Tests -c Release --no-build

      - name: Publish (self-contained)
        shell: pwsh
        run: |
          dotnet publish TaoSFV/TaoSFV.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish/win-x64
          dotnet publish TaoSFV.Cli/TaoSFV.Cli.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish/win-x64
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt publish/win-x64

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: TaoSFV-win-x64
          path: publish/win-x64
